<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Plan">
<title>Daily Plan</title>
<style>
  :root{
    --bg:#0f1420; --card:#171e2e; --card2:#1e2740; --line:#2a3550;
    --ink:#eef2fb; --mut:#9fb0d0; --dim:#6f80a4;
    --food:#f0a63a; --work:#5aa0f0; --play:#43c59e; --rest:#b58cf0;
    --accent:#5aa0f0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
  .hi{font-size:20px;font-weight:600}
  .chip{font-size:12px;color:var(--mut);background:var(--card2);border:1px solid var(--line);
    padding:5px 10px;border-radius:20px;white-space:nowrap}
  .daybar{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
  .daybtn{flex:0 0 auto;font-size:13px;color:var(--mut);background:var(--card);
    border:1px solid var(--line);padding:7px 11px;border-radius:10px;cursor:pointer}
  .daybtn.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .now{background:linear-gradient(180deg,#1b2540,#171e2e);border:1px solid #35507f;
    border-radius:16px;padding:14px 15px;margin:2px 0 14px}
  .now .lab{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-bottom:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--play);box-shadow:0 0 0 4px rgba(67,197,158,.18)}
  .now .t{font-size:19px;font-weight:600}
  .now .d{font-size:14px;color:var(--mut);margin-top:3px;line-height:1.5}
  .sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 4px 8px}
  .block{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:border-color .15s}
  .block.cur{border-color:#35507f;background:var(--card2)}
  .block .row{display:flex;align-items:flex-start;gap:11px}
  .time{font-size:13px;color:var(--mut);min-width:58px;padding-top:2px;font-variant-numeric:tabular-nums}
  .bt{font-size:15px;font-weight:600;line-height:1.35}
  .tag{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto}
  .tag.food{background:var(--food)}.tag.work{background:var(--work)}
  .tag.play{background:var(--play)}.tag.rest{background:var(--rest)}
  .meta{margin-left:auto;font-size:12px;color:var(--dim);white-space:nowrap;padding-top:3px}
  .detail{margin:10px 0 2px;padding-top:10px;border-top:1px solid var(--line)}
  .li{display:flex;align-items:flex-start;gap:9px;font-size:14px;color:var(--ink);padding:5px 0;line-height:1.45}
  .box{width:17px;height:17px;border-radius:5px;border:1.6px solid var(--dim);flex:0 0 auto;margin-top:1px}
  .supp{font-size:13px;color:var(--food);margin-top:6px;line-height:1.5}
  .move{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-top:9px}
  .mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .mn{font-size:15px;font-weight:600}
  .msr{font-size:12px;color:var(--mut);white-space:nowrap}
  .mc{font-size:13px;color:var(--mut);margin-top:5px;line-height:1.5}
  .mtag{font-size:11px;color:var(--dim);margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
  .goals{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:6px}
  .goals .g{font-size:13px;color:var(--mut);padding:3px 0;line-height:1.4}
  .foot{text-align:center;color:var(--dim);font-size:12px;margin-top:20px}
  .load{color:var(--mut);text-align:center;padding:40px 0;font-size:14px}
  .err{color:#f0888a;text-align:center;padding:30px 12px;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="load">Loading your plan…</div></div>

<script type="module" src="https://nalxowbclhvopjqkvweh.supabase.co/functions/v1/asset?name=app.js"></script>
</body>
</html>
