<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Plan">
<title>Daily Plan</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="wrap"><div class="load">Loading your plan…</div></div>
<nav class="tabbar" id="tabbar"><div class="tabbar-inner">
  <button class="tab active" data-tab="plan">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Today
  </button>
  <button class="tab" data-tab="hub">
    <svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M4 9v6M20 9v6M6 12h12"/></svg>
    Train
  </button>
  <button class="tab" data-tab="coach">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Coach
  </button>
  <button class="tab" data-tab="profile">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21c0-3.3-3.6-6-8-6s-8 2.7-8 6"/></svg>
    You
  </button>
</div></nav>
<script type="module" src="app.js"></script>
</body>
</html>
